    <style>
      /* Global CSS rules applied on the main document */
      :root,
      html {
        /* This activates the light-dark() evaluation engine globally */
        color-scheme: light dark;
      }

      /* Explicitly bind the color-scheme state to your data attributes */
      html[data-theme="light"] {
        color-scheme: light;
      }

      html[data-theme="dark"] {
        color-scheme: dark;
      }

      :root {
        --bg-primary-light: #e4d9d9;
        --text-primary-light: #1f1d1d;
        --bg-secondary-dark: #333;
        --text-secondary-dark: #fff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      .nav-link {
        text-decoration: none;
        color: var(--text-primary-light, #1f1d1d);
      }

      .nav-link:hover {
        text-decoration: underline;
        text-underline-offset: 2px;
      }
    </style>
  </head>

      <form onsubmit="submitRad(event)">

            name="plan"
            value="free"
            label="Free"
            checked
            required

          <sample-radio-v1
            name="plan"
            value="Pro"
            label="Pro"
            checked
          ></sample-radio-v1>
          <sample-radio-v1
            name="plan"
            value="team"
            label="Team"
            disabled
          ></sample-radio-v1>
          <button type="submit">Submit</button>

    <div id="main-content"></div>

    <script>
      function submitRad(event) {
        event.preventDefault();
        const formData = new FormData(event.target);
        console.log(Object.fromEntries(formData));
      }

      function inputChangeHandler(event) {
        console.log("Input target:", event.target);
        console.log("Input value changed:", event.target.value);
      }

      function changeTheme() {
        const toggleButton = document.getElementById("theme-toggle");
        const htmlElement = document.documentElement;

        // Load saved theme or check system preference
        const savedTheme = localStorage.getItem("theme");
        const systemPrefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        const initialTheme =
          savedTheme || (systemPrefersDark ? "dark" : "light");

        htmlElement.setAttribute("data-theme", initialTheme);
        const currentTheme = htmlElement.getAttribute("data-theme");
        const newTheme = currentTheme === "dark" ? "light" : "dark";

        htmlElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("theme", newTheme);
      }

      (function () {
        const path = window.location.pathname;
        navigateTo(path);
      })();

      function navigateTo(path) {
        history.pushState(null, null, path);
        window.dispatchEvent(new Event("location-changed"));

        const mainContent = document.getElementById("main-content");

        switch (path) {
          case "/":
            mainContent.innerHTML = "<home-view></home-view>";
            break;
          case "/cards":
            mainContent.innerHTML = "<cards-view></cards-view>";
            break;
          case "/forms":
            mainContent.innerHTML = "<h1>About Page</h1>";
            break;
          case "/contact":
            mainContent.innerHTML = "<h1>Contact Page</h1>";
            break;
          default:
            mainContent.innerHTML = "<h1>404 - Page Not Found</h1>";
        }
      }

      window.customElements.define(
        "home-view",
        class extends HTMLElement {
          connectedCallback() {
            const shadow = this.attachShadow({ mode: "open" });
            shadow.innerHTML = `
                  <div
                    style="
                      display: flex;
                      gap: 2rem;
                      padding: 1rem;
                      flex-wrap: wrap;
                      align-items: center;
                      justify-content: center;
                    "
                  >
                    <h1>Home View</h1>
                  </div>
                `;
          }
        },
      );
